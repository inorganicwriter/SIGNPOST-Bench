[project]
name = "signpost-bench"
version = "0.1.0"
description = "SIGNPOST-Bench: Benchmarking Text-Vision Conflict Resolution in Multimodal Large Language Models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sirun Li" },
    { name = "Minghao Liu" },
    { name = "Ling Dai" },
    { name = "Yong Li" },
    { name = "Haoxin Lyu" },
    { name = "Junting Zhou" },
    { name = "Fan Zhang" },
]

[project.urls]
Homepage = "https://github.com/inorganicwriter/SIGNPOST-Bench"
Repository = "https://github.com/inorganicwriter/SIGNPOST-Bench"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "data/",
    "result/",
    "results/",
]

[tool.ruff.lint]
# Conservative starter rule set:
#   E  = pycodestyle errors
#   W  = pycodestyle warnings (trailing whitespace etc.)
#   F  = pyflakes (unused imports, undefined names)
#   I  = isort
#   UP = pyupgrade (modernize typing/syntax)
#   B  = bugbear (common gotchas)
#   C4 = comprehensions
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # line length handled by formatter, not lint
    "E731",   # lambda assignments are fine in matplotlib callbacks
    "B008",   # function call in default arg (used by argparse defaults)
    "B904",   # raise from in except — too noisy for gradual cleanup
    "UP007",  # keep Optional/Union for backward-compat with typing-using modules
    "UP035",  # keep typing imports for the same reason
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # tests may rearrange sys.path before local imports
"paper/figures/*" = ["E402"]
"paper-AAAI/figures/*" = ["E402"]
"analysis/*" = ["E402"]
"evaluation/*" = ["E402"]
"data_collector/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:easyocr.*",
    "ignore::DeprecationWarning:google.*",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
